name: Status Badge

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-status-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Generate status badge JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'history';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.yml') && f !== 'summary.yml');
            let down = false;
            let degraded = false;
            const statuses = {};
            for (const f of files) {
              const content = fs.readFileSync(path.join(dir, f), 'utf8');
              const m = content.match(/^status:\s*(\S+)/m);
              const s = m ? m[1].toLowerCase() : 'unknown';
              statuses[f.replace(/\.yml$/, '')] = s;
              if (s === 'down') down = true;
              else if (s === 'degraded') degraded = true;
            }
            let message;
            let color;
            if (down) {
              message = 'service disruption';
              color = 'critical';
            } else if (degraded) {
              message = 'degraded performance';
              color = 'orange';
            } else {
              message = 'operational';
              color = 'brightgreen';
            }
            fs.writeFileSync('api/status.json', JSON.stringify({ schemaVersion: 1, label: 'status', message, color }));
            core.info(JSON.stringify({ statuses, message, color }));

      - name: Commit status badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update status badge [skip ci]"
          file_pattern: api/status.json
          commit_author_name: "Upptime Bot"
          commit_author_email: "upptime@koj.co"
