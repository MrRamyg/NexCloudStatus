[build]
  command = "hugo --minify --enableGitInfo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.128.2"

[context.production.environment]
  HUGO_ENV = "production"
  NODE_ENV = "production"

[context.deploy-preview]
  command = "hugo --minify --enableGitInfo -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --minify --enableGitInfo -b $DEPLOY_PRIME_URL"
